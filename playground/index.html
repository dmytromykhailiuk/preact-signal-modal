<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>preact-signal-modal — playground</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #fbfbfd;
        color: #14161c;
      }
      #app {
        max-width: 46rem;
        margin: 0 auto;
        padding: 2rem 1.5rem 6rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
      }
      h2 {
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #6b7181;
        margin: 2rem 0 0.75rem;
      }
      p.lede {
        color: #6b7181;
        margin: 0 0 1.5rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      button {
        font: inherit;
        padding: 0.5rem 0.9rem;
        border: 1px solid #d7d9e2;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }
      button:hover {
        border-color: #5b4bd6;
        color: #5b4bd6;
      }
      button[aria-pressed="true"] {
        background: #5b4bd6;
        border-color: #5b4bd6;
        color: #fff;
      }
      pre {
        background: #14171d;
        color: #e9ebf1;
        padding: 0.9rem 1rem;
        border-radius: 10px;
        font-size: 0.8rem;
        line-height: 1.6;
        max-height: 16rem;
        overflow: auto;
      }
      .filler {
        color: #8b93a6;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
